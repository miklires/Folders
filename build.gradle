plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.9.0'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "folders" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}


repositories {
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "maven.modrinth:yacl:3.9.5+26.2-fabric"
    include "maven.modrinth:yacl:3.9.5+26.2-fabric"
    implementation "maven.modrinth:modmenu:20.0.1"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Everything under dev.miklires.folders.core is free of Minecraft imports, so the
// model, the storage and the layout can be tested on a plain JVM. See README.
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

/**
 * Dumps the signatures of the vanilla classes this mod hooks into, to
 * build/api.txt.
 *
 * Folders lives on a handful of Minecraft internals whose names move between
 * versions, and guessing them costs a crash per guess. This asks Gradle for the
 * exact remapped jar it already resolved -- no hunting through the Loom cache --
 * and runs javap over it. Re-run it after any version bump:
 *
 *     ./gradlew dumpApi
 */
tasks.register("dumpApi") {
    description = "Writes signatures of the vanilla classes Folders hooks into to build/api.txt"
    def classpath = sourceSets.client.compileClasspath
    def target = layout.buildDirectory.file("api.txt")

    doLast {
        def names = [
                "net.minecraft.client.gui.components.AbstractSelectionList",
                "net.minecraft.client.gui.components.AbstractSelectionList\$Entry",
                "net.minecraft.client.gui.components.ObjectSelectionList",
                "net.minecraft.client.gui.components.ObjectSelectionList\$Entry",
                "net.minecraft.client.gui.components.SelectableEntry",
                "net.minecraft.client.gui.components.events.ContainerEventHandler",
                "net.minecraft.client.gui.screens.worldselection.SelectWorldScreen",
                "net.minecraft.client.gui.screens.worldselection.WorldSelectionList",
                "net.minecraft.client.gui.screens.worldselection.WorldSelectionList\$Entry",
                "net.minecraft.client.gui.screens.worldselection.WorldSelectionList\$WorldListEntry",
                "net.minecraft.client.gui.screens.multiplayer.JoinMultiplayerScreen",
                "net.minecraft.client.gui.screens.multiplayer.ServerSelectionList",
                "net.minecraft.client.gui.screens.multiplayer.ServerSelectionList\$Entry",
                "net.minecraft.client.gui.screens.multiplayer.ServerSelectionList\$OnlineServerEntry",
                "net.minecraft.client.multiplayer.ServerData",
                "net.minecraft.client.multiplayer.ServerStatusPinger",
                "net.minecraft.client.gui.screens.packs.PackSelectionScreen",
                "net.minecraft.client.gui.screens.packs.PackSelectionModel",
                "net.minecraft.client.gui.screens.packs.PackSelectionModel\$Entry",
                "net.minecraft.client.gui.screens.packs.TransferableSelectionList",
                "net.minecraft.client.gui.screens.packs.TransferableSelectionList\$Entry",
                "net.minecraft.client.gui.screens.packs.TransferableSelectionList\$PackEntry",
                "net.minecraft.client.gui.GuiGraphicsExtractor",
                "net.minecraft.client.input.KeyEvent",
                "net.minecraft.client.input.CharacterEvent",
                "net.minecraft.client.input.MouseButtonEvent",
                "net.minecraft.client.Minecraft",
                "net.minecraft.client.gui.components.AbstractWidget",
                "net.minecraft.client.gui.components.AbstractContainerWidget",
                "net.minecraft.client.gui.components.AbstractScrollArea",
                "net.minecraft.client.gui.screens.Screen",
        ]

        def javap = java.util.spi.ToolProvider.findFirst("javap")
                .orElseThrow { new GradleException("javap is not available in this JDK") }

        def file = target.get().asFile
        file.parentFile.mkdirs()
        file.withPrintWriter("UTF-8") { writer ->
            names.each { name ->
                writer.println("===== ${name} =====")
                def buffer = new ByteArrayOutputStream()
                // javap writes both output and errors here, so a missing class
                // shows up in the dump instead of vanishing to stderr.
                new PrintWriter(buffer, true).withCloseable { sink ->
                    javap.run(sink, sink, "-p", "-cp", classpath.asPath, name)
                }
                writer.println(buffer.toString("UTF-8").trim())
                writer.println()
            }
        }
        logger.lifecycle("Wrote ${file}")
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = System.getenv("MODRINTH_PROJECT_ID")
    versionNumber = project.version
    versionName = "Folders ${project.version}"
    versionType = "release"
    // Loom 1.17 remaps the production artifact in the jar task.
    uploadFile = tasks.jar
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    changelog = """Fixes folder creation, preserves hidden items during internal redraws and world searches, moves controls into vanilla footer layouts, and adds confirmed folder deletion."""
    syncBodyFrom = rootProject.file("README.md").text
    dependencies {
        required.project "fabric-api"
        required.project "yacl"
        optional.project "modmenu"
    }
}

tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
